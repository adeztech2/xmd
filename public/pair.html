<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>NEXUS Pairing</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101827; color: #f8fafc; font: 16px system-ui, sans-serif; }
    main { width: min(100%, 430px); padding: 28px; border: 1px solid #334155; border-radius: 18px; background: #172235; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #cbd5e1; line-height: 1.5; }
    label { display: block; margin: 20px 0 8px; font-weight: 600; }
    input, button { width: 100%; padding: 13px 14px; border-radius: 10px; font: inherit; }
    input { color: #f8fafc; background: #0f172a; border: 1px solid #475569; }
    button { margin-top: 12px; border: 0; background: #38bdf8; color: #082f49; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    output { display: block; margin-top: 18px; padding: 14px; min-height: 52px; border-radius: 10px; background: #0f172a; overflow-wrap: anywhere; }
    .code { font-size: 25px; letter-spacing: 3px; font-weight: 800; text-align: center; }
    small { color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <h1>NEXUS Pairing</h1>
    <p>Enter your WhatsApp number with country code. Use digits only, for example <b>2547XXXXXXXX</b>.</p>
    <form id="pair-form">
      <label for="number">WhatsApp number</label>
      <input id="number" name="number" inputmode="numeric" autocomplete="tel" minlength="8" maxlength="15" required placeholder="2547XXXXXXXX">
      <button id="submit" type="submit">Get pairing code</button>
    </form>
    <output id="result" aria-live="polite">Your pairing code will appear here.</output>
    <p><small>Open WhatsApp → Linked devices → Link with phone number, then enter the code. Never share your session ID.</small></p>
  </main>
  <script>
    const form = document.getElementById('pair-form');
    const button = document.getElementById('submit');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const number = document.getElementById('number').value.replace(/\\D/g, '');
      button.disabled = true;
      result.className = '';
      result.textContent = 'Requesting a pairing code…';
      try {
        const response = await fetch(`/api/pair?number=${encodeURIComponent(number)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not create pairing code.');
        result.className = 'code';
        result.textContent = data.code;
      } catch (error) {
        result.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
